<!DOCTYPE html>

    <meta charset="UTF-8">

        <div class="exercises-grid">

                <button onclick="exercicio01CompararDoisNumeros()">Executar</button>
            </div>

            <div class="exercise-card">

                <label for="nomeEx2">Nome</label>

            </div>

                <select name="selectEx4" id="select-Ex4">
                    <option value="selecionar" selected disabled>Selecione o desconto</option>
                    <option value="10">10% de desconto</option>
                    <option value="20">20% de desconto</option>
                    <option value="30">30% de desconto</option>
                    <option value="40">40% de desconto</option>
                    <option value="50">50% de desconto</option>
                </select>

                <button onclick="exercicio04CalcularDescontoProduto()">Executar</button>

                <label for="resultadoEx4">Resultado</label>
                <textarea name="textoEx4" id="resultadoEx4" readonly disabled></textarea>
            </div>

            <div class="exercise-card">
                <h2>Exercicio05</h2>

                <label for="nome-funcionarioEx5">Nome do funcionario</label>
                <input type="text" id="nome-funcionarioEx5">

                <label for="salario-atualEx5">Salario atual</label>
                <input type="number" id="salario-atualEx5">

                <label for="selectEx4">Selecione o cargo</label>
                <select name="selectEx4" id="select-Ex5">
                    <option value="selecionar" selected disabled>Selecione o cargo</option>
                    <option value="Estagiario">Estagiario</option>
                    <option value="Atendente">Atendente</option>
                    <option value="Auxiliar-administrativo">Auxiliar administrativo</option>
                    <option value="Supervisor">Supervisor</option>
                    <option value="Gerente">Gerente</option>
                </select>

                <button onclick="exercicio05SimularSalario()">Executar</button>

                <label for="resultadoEx5">Resultado</label>
                <textarea name="textoEx5" id="resultadoEx5" readonly disabled></textarea>
            </div>

            <div class="exercise-card">
                <h2>Exercicio06</h2>

                <label for="nome-clienteEx6">Nome do cliente</label>
                <input type="text" id="nome-clienteEx6">

                <label for="valor-consumidoEx6">Valor consumido</label>
                <input type="number" id="valor-consumidoEx6">

                <div class="checkbox-row">
                    <input type="checkbox" id="checkboxEx6" name="taxa">
                    <label for="checkboxEx6">Pagar taxa de serviço?</label>
                </div>

                <button onclick="exercicio06CalcularContaRestaurante()">Executar</button>

                <label for="resultadoEx6">Resultado</label>
                <textarea name="textoEx6" id="resultadoEx6" readonly disabled></textarea>
            </div>

                <h2>Exercicio07</h2>

                <label for="nome-alunoEx7">Nome do aluno</label>
                <input type="text" id="nome-alunoEx7">

                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="tipo-erp" name="tipoEx7" value="Matutino">
                        <label for="tipo-erp">Matutino</label>
                    </div>
    
                    <div class="radio-option">
                        <input type="radio" id="tipo-hospital" name="tipoEx7" value="Vespertino">
                        <label for="tipo-hospital">Vespertino</label>
                    </div>
    
                    <div class="radio-option">
                        <input type="radio" id="tipo-oficina" name="tipoEx7" value="Noturno">
                        <label for="tipo-oficina">Noturno</label>
                    </div>
                </div>

                <select name="selectEx4" id="selectEx7">
                    <option value="selecionar" selected disabled>Selecione o curso</option>
                    <option value="TI">TI</option>
                    <option value="Super Dev">Super Dev</option>
                    <option value="Quimica">Quimica</option>
                </select>

                <button onclick="exercicio07CadastrarAlunoTurnoCurso()">Executar</button>

                <label for="resultadoEx6">Resultado</label>
                <textarea name="textoEx6" id="resultadoEx7" readonly disabled></textarea>

            </div>

            <div class="exercise-card exercise-card--placeholder">

                <label for="nome-clienteEx8">Nome do cliente</label>
                <input type="text" id="nome-clienteEx8">

                <select name="selectEx4" id="selectEx8">
                    <option value="selecionar" selected disabled>Selecione o tipo de carro</option>
                    <option value="Onix">Onix</option>
                    <option value="Tesla">Tesla</option>
                    <option value="LandHover">LandHover</option>
                </select>

                <label for="quantidade-diasEx8">Quantidade de dias</label>
                <input type="number" id="quantidade-diasEx8">

                <input type="checkbox" id="check-seguroEx8" name='tipoEx8'>
                <label for="check-seguroEx8">Seguro</label>

                <input type="checkbox" id="check-cadeira-infantilEx8" name='tipoEx82'>

                <button onclick="exercicio08SimularLocacaoCarro()">Executar</button>

                <label for="resultadoEx8">Resultado</label>
                <textarea name="textoEx6" id="resultadoEx8" readonly disabled></textarea>

            </div>

            <div class="exercise-card exercise-card--placeholder">

                <h2>Exercicio10</h2>

            </div>
