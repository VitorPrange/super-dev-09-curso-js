<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos</title>
    <link rel="stylesheet" href="../assets/css/exercicio-04-fetch-backend.css">
</head>
<body>

    <div>
        <h1>Mecanica agendamento</h1>

        <div>
            <button onclick="cadastrarCliente()">Cadastrar cliente</button>

        <div>
            <button onclick="listarClientes()">Listar clientes</button>

        <div>

        <div>
            <button onclick="editarCliente()">Editar cliente</button>
        </div>

        <div>
            <button onclick="apagarCliente()">Apagar cliente</button>
        </div>

        <div>
            <button onclick="cadastrarAgendamento()">Cadastrar Agendamento</button>
        </div>

        <div>
            <button onclick="listarAgendamentos()">Listar agendamentos</button>

            <button onclick="editarAgendamento()">Editar agendamento</button>
        </div>

        <div>
            <button onclick="apagarAgendamento()">Apagar agendamento</button>
        </div>

        <div class="ta">
            <textarea name="clientes-texto" id="clientes-texto" readonly></textarea>
        </div>

        <div class="ta">
            <textarea name="agendamentos" id="agendamentos" readonly></textarea>
        </div>

        <select name="select" id="clientes" class="hidden">

            <option value="selected" selected disabled>Selecione um cliente</option>
        </select>
    </div>

    <script src="../assets/js/exercicio-04-fetch-backend.js"></script>
