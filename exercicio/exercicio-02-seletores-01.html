    <link rel="stylesheet" href="../assets/css/exercicio-02-seletores-01.css">
</head>
<body>

        <div>
            <label for="nome-prato">Nome do prato</label>

            <input type="numer" id="preco-prato">

        <div>
            <select name="select" id="select-categoria">
                <option value="select" selected disabled>Selecione uma categoria</option>
                <option value="lanche">Lanche</option>
                <option value="bebida">Bebida</option>
                <option value="sobremesa">Sobremesa</option>
            </select>
        </div>

        <div>
            <button>Adicionar ao cardapio</button>
        </div>

        <div>
            <h1>Pratos cadastrados</h1>
        </div>




    </div>

    <script src="../assets/js/exercicio-02-seletores-01.js"></script>
